name: QA test case recommendations

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

# --- ADICIONE ESTE BLOCO DE PERMISSÕES ---
permissions:
  contents: read
  pull-requests: write
  issues: write
# ------------------------------------------

jobs:
  recommend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run recommendation script
        run: npm run recommend:pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}